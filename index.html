<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>짤패드</title>
<link rel="icon" type="image/png" href="images/assets/JJAL_icon-favicon-32x32.png?v=2">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&display=swap');

  .category-title {
    grid-column: 1 / -1;
    font-size: 15px;
    font-weight: 700;
    color: var(--text-dim);
    margin-top: 10px;
  }

  :root {
    --bg: #14171c;
    --surface: #1d2229;
    --surface-hover: #262c35;
    --border: #2c333d;
    --text: #f2f1ed;
    --text-dim: #8b93a1;
    --img: #ff5470;
    --gif: #c6ff3d;
    --video: #3fa7ff;
    --tag-emo: #ffb142;
    --tag-jjal: #2bcbba;
    --tag-meme: #b36bff;
    --tag-pol: #fed330;
    --tag-friends: #45aaf2;
    --tag-extra: #ff793f;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 40px 24px 80px;
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    margin-bottom: 24px;
  }

  h1 {
    font-family: 'Archivo', sans-serif;
    font-weight: 800;
    font-size: 40px;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }

  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 14px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  #search {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    padding: 11px 15px;
    border-radius: 10px;
    width: 240px;
    outline: none;
  }

  #search:focus {
    border-color: var(--text-dim);
  }

  #search::placeholder {
    color: var(--text-dim);
  }

  .btn-edit-mode {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    padding: 11px 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: all .15s;
  }

  .btn-edit-mode:hover {
    color: var(--text);
    border-color: var(--text-dim);
  }

  .btn-edit-mode.active {
    background: #ff9f43;
    color: var(--bg);
    border-color: transparent;
  }

  .edit-banner {
    display: none;
    background: #1f2630;
    border: 1px solid #3c4657;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 20px;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .edit-banner.show {
    display: flex;
  }

  .edit-banner-info {
    font-size: 13px;
    color: var(--text);
    line-height: 1.45;
  }

  .edit-banner-info strong {
    color: #ff9f43;
  }

  .edit-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .btn-action {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
    padding: 8px 13px;
    border-radius: 8px;
    cursor: pointer;
  }

  .btn-action.primary {
    background: var(--gif);
    color: var(--bg);
    border-color: transparent;
  }

  .btn-action:hover {
    opacity: 0.9;
  }

  .filter-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 26px;
  }

  .chips-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .row-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dim);
    min-width: 42px;
    margin-right: 4px;
  }

  .chip {
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    user-select: none;
    transition: background .15s, color .15s, border-color .15s;
  }

  .chip:hover {
    color: var(--text);
    border-color: #3d4654;
  }

  .chip .count {
    font-size: 11px;
    font-weight: 700;
    opacity: 0.75;
  }

  .chip.active {
    color: var(--bg);
    border-color: transparent;
    background: var(--tag-extra);
  }

  .chip[data-cat="all"].active,
  .chip[data-type="all"].active,
  .chip[data-theme="all"].active {
    background: var(--text);
  }

  .chip[data-cat="img"].active {
    background: var(--img);
  }

  .chip[data-cat="gif"].active {
    background: var(--gif);
  }

  .chip[data-cat="video"].active {
    background: var(--video);
  }

  .chip[data-type="이모티콘"].active {
    background: var(--tag-emo);
  }

  .chip[data-type="짤"].active {
    background: var(--tag-jjal);
  }

  .chip[data-type="MEME"].active {
    background: var(--tag-meme);
  }

  .chip[data-theme="정치인"].active {
    background: var(--tag-pol);
  }

  .chip[data-theme="프렌즈"].active {
    background: var(--tag-friends);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
    margin-bottom: 40px;
  }

  .pad {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 12px 14px;
    text-align: center;
    cursor: pointer;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }

  .pad:hover {
    background: var(--surface-hover);
  }

  .pad:active,
  .pad.fired {
    transform: translate(3px, 3px);
    box-shadow: 1px 1px 0 rgba(0,0,0,0.35);
  }

  .pad .emoji {
    font-size: 30px;
    display: block;
    margin-bottom: 10px;
  }

  .pad-img {
    width: 56px;
    height: 56px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 10px;
    display: block;
    margin-left: auto;
    margin-right: auto;
  }

  .pad .label {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    display: block;
    width: 100%;
    margin-bottom: 8px;
    word-break: keep-all;
    overflow-wrap: break-word;
    text-wrap: balance;
  }

  .tag-group {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px;
  }

  .tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    color: var(--bg);
  }

  .tag.img {
    background: var(--img);
  }

  .tag.gif {
    background: var(--gif);
  }

  .tag.video {
    background: var(--video);
  }

  .tag.sub-tag {
    background: transparent;
    border: 1px solid rgba(255, 121, 63, 0.45);
    color: var(--tag-extra);
    font-weight: 600;
  }

  .tag.sub-tag[data-t="이모티콘"] {
    border-color: rgba(255, 177, 66, 0.45);
    color: var(--tag-emo);
  }

  .tag.sub-tag[data-t="짤"] {
    border-color: rgba(43, 203, 186, 0.45);
    color: var(--tag-jjal);
  }

  .tag.sub-tag[data-t="MEME"] {
    border-color: rgba(179, 107, 255, 0.45);
    color: var(--tag-meme);
  }

  .tag.sub-tag[data-t="정치인"] {
    border-color: rgba(254, 211, 48, 0.45);
    color: var(--tag-pol);
  }

  .tag.sub-tag[data-t="프렌즈"] {
    border-color: rgba(69, 170, 242, 0.45);
    color: var(--tag-friends);
  }

  /* 편집 모드용 토글 버튼 스타일 */
  .edit-tag-btn {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 6px;
    border: 1px dashed #3d4654;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    opacity: 0.45;
    transition: all .12s;
  }

  .edit-tag-btn:hover {
    opacity: 0.85;
  }

  .edit-tag-btn.on {
    opacity: 1;
    border-style: solid;
    background: rgba(255, 121, 63, 0.14);
    color: var(--tag-extra);
    border-color: var(--tag-extra);
  }

  .edit-tag-btn.on[data-t="이모티콘"] {
    color: var(--tag-emo);
    border-color: var(--tag-emo);
    background: rgba(255, 177, 66, 0.14);
  }

  .edit-tag-btn.on[data-t="짤"] {
    color: var(--tag-jjal);
    border-color: var(--tag-jjal);
    background: rgba(43, 203, 186, 0.14);
  }

  .edit-tag-btn.on[data-t="MEME"] {
    color: var(--tag-meme);
    border-color: var(--tag-meme);
    background: rgba(179, 107, 255, 0.14);
  }

  .edit-tag-btn.on[data-t="정치인"] {
    color: var(--tag-pol);
    border-color: var(--tag-pol);
    background: rgba(254, 211, 48, 0.14);
  }

  .edit-tag-btn.on[data-t="프렌즈"] {
    color: var(--tag-friends);
    border-color: var(--tag-friends);
    background: rgba(69, 170, 242, 0.14);
  }

  .pad.hidden {
    display: none;
  }

  .recent-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  .recent-row {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .recent-item {
    flex: 0 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .recent-thumb {
    width: 24px;
    height: 24px;
    object-fit: cover;
    border-radius: 4px;
  }

  .empty-note {
    color: var(--text-dim);
    font-size: 13px;
    grid-column: 1 / -1;
    padding: 20px 0;
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 20px);
    background: var(--text);
    color: var(--bg);
    font-weight: 600;
    font-size: 14px;
    padding: 12px 20px;
    border-radius: 10px;
    opacity: 0;
    transition: opacity .18s, transform .18s;
    pointer-events: none;
    z-index: 100;
  }

  #toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
</style>
</head>

<body>
<div class="wrap">

  <header>
    <div>
      <h1>짤패드</h1>
      <p>채팅할 때 바로 꺼내 쓰는 나만의 짤 보드</p>
    </div>
    <div class="header-right">
      <input id="search" type="text" placeholder="짤 또는 태그 검색... (예: 따봉, 프렌즈)">
      <button id="editModeBtn" class="btn-edit-mode" type="button">⚙️ 태그 편집</button>
    </div>
  </header>

  <div id="editBanner" class="edit-banner">
    <div class="edit-banner-info">
      <strong>태그 편집 모드 켜짐</strong> — 태그를 켜고 끄더라도 항상 <b>분류 → 태그</b> 순서대로 자동 정렬됩니다.<br>
      수정한 뒤 우측의 <b>pads.js 다운로드</b>를 눌러 기존 파일에 덮어쓰면 영구 반영됩니다!
    </div>
    <div class="edit-actions">
      <button id="addTagBtn" class="btn-action" type="button">+ 새 태그 추가</button>
      <button id="copyPadsBtn" class="btn-action" type="button">📋 코드 복사</button>
      <button id="downloadPadsBtn" class="btn-action primary" type="button">💾 pads.js 다운로드</button>
    </div>
  </div>

  <div class="filter-section">
    <!-- 1줄: 파일 포맷 필터 -->
    <div class="chips-row" id="catChips">
      <span class="row-label">포맷</span>
      <div class="chip active" data-cat="all">전체 <span class="count" id="cnt-cat-all"></span></div>
      <div class="chip" data-cat="img">이미지 <span class="count" id="cnt-cat-img"></span></div>
      <div class="chip" data-cat="gif">GIF <span class="count" id="cnt-cat-gif"></span></div>
      <div class="chip" data-cat="video">영상 <span class="count" id="cnt-cat-video"></span></div>
    </div>

    <!-- 2줄: 기본 분류 (이모티콘 / 짤 / MEME) -->
    <div class="chips-row" id="typeChips"></div>

    <!-- 3줄: 추가 태그 / 테마 (정치인 / 프렌즈 등) -->
    <div class="chips-row" id="themeChips"></div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="recent-label">최근 사용</div>
  <div class="recent-row" id="recentRow">
    <span class="empty-note">아직 사용한 짤이 없어요</span>
  </div>

</div>

<div id="toast"></div>

<script src="pads.js?v=20261014_3"></script>

  // 전체 태그 표준 정렬 순서 (분류 순서 -> 태그 순서)
  function getMasterOrder() {

  // 어떤 순서로 태그를 켜고 끄더라도 항상 상단 바에 표시된 순서대로 정렬
  function sortTagsCanonically(tagsArr) {
    if (!Array.isArray(tagsArr)) return [];
    const order = getMasterOrder();
    const unique = [...new Set(tagsArr)];
    return unique.sort((a, b) => {
      const ia = order.indexOf(a);
      const ib = order.indexOf(b);
      if (ia === -1 && ib === -1) return a.localeCompare(b, 'ko');
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    });

  function updateCounts(q) {
    // 1줄: 포맷 개수 계산
    const cats = ['all', 'img', 'gif', 'video'];
    cats.forEach(c => {
      const count = pads.filter(p => {
        const pCat = getCat(p);
        const pTags = p.tags || [];
        const matchC = c === 'all' || pCat === c;
        const matchType = activeType === 'all' || pTags.includes(activeType);
        const matchTheme = activeTheme === 'all' || pTags.includes(activeTheme);
        return matchC && matchType && matchTheme && matchesSearch(p, q);
      }).length;
      const el = document.getElementById(`cnt-cat-${c}`);
      if (el) el.textContent = count;
    });

    // 2줄: 분류 개수 계산
    const types = ['all', ...currentTypeList];
    types.forEach(t => {
      const count = pads.filter(p => {
        const pCat = getCat(p);
        const pTags = p.tags || [];
        const matchC = activeCat === 'all' || pCat === activeCat;
        const matchType = t === 'all' || pTags.includes(t);

    themes.forEach(t => {
      const count = pads.filter(p => {

        const matchC = activeCat === 'all' || pCat === activeCat;
        const matchType = activeType === 'all' || pTags.includes(activeType);
        const matchTheme = t === 'all' || pTags.includes(t);
        return matchC && matchType && matchTheme && matchesSearch(p, q);
      }).length;
      const el = document.getElementById(`cnt-theme-${t}`);
      if (el) el.textContent = count;
    });

  function render() {
    const q = searchInput.value.trim().toLowerCase();
    grid.innerHTML = '';
    updateCounts(q);

    const categories = activeCat === 'all'
      ? ['img', 'gif', 'video']
      : [activeCat];

    let totalRendered = 0;

    categories.forEach(cat => {
      const list = pads
        .filter(p => {
          const pCat = getCat(p);
          const pTags = p.tags || [];
          const matchCat = pCat === cat;
          const matchType = activeType === 'all' || pTags.includes(activeType);
          const matchTheme = activeTheme === 'all' || pTags.includes(activeTheme);
          return matchCat && matchType && matchTheme && matchesSearch(p, q);
        })
        .sort((a, b) => a.label.replace(/^[^가-힣a-zA-Z0-9]+/, '').localeCompare(b.label.replace(/^[^가-힣a-zA-Z0-9]+/, ''), 'ko'));

  function generatePadsJsText() {
    const cleanLabel = s => s.replace(/^[^가-힣a-zA-Z0-9]+/, '').trim();
    const getChosungGroup = label => {
      const c = cleanLabel(label);
      if (!c) return '기타';
      const code = c.charCodeAt(0);
      if (code >= 0xAC00 && code <= 0xD7A3) {
        const chosung = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
        const idx = Math.floor((code - 0xAC00) / 588);
        const ch = chosung[idx];
        const map = {'ㄲ':'ㄱ', 'ㄸ':'ㄷ', 'ㅃ':'ㅂ', 'ㅆ':'ㅅ', 'ㅉ':'ㅈ'};
        return map[ch] || ch;
      }
      return 'A-Z';
    };

    const sorted = [...pads].sort((a, b) => cleanLabel(a.label).localeCompare(cleanLabel(b.label), 'ko'));
    const typeListStr = '[' + currentTypeList.map(t => `'${t}'`).join(', ') + ']';
    const extraTagListStr = '[' + currentThemeList.map(t => `'${t}'`).join(', ') + ']';
    const allTagListStr = '[' + getMasterOrder().map(t => `'${t}'`).join(', ') + ']';

    let out = `const catName = {\n  img: '이미지',\n  gif: 'GIF',\n  video: '영상'\n};\n\nconst typeList = ${typeListStr};\nconst extraTagList = ${extraTagListStr};\nconst tagList = ${allTagListStr};\n\nconst pads = [\n`;
    let lastGroup = null;
    sorted.forEach(p => {
      const g = getChosungGroup(p.label);
      if (g !== lastGroup) {
        if (lastGroup !== null) out += '\n';
        out += `  // [${g}]\n`;
        lastGroup = g;
      }
      const mediaKey = p.video ? 'video' : 'image';
      const mediaVal = p.video || p.image;
      const pCat = getCat(p);
      const orderedTags = sortTagsCanonically(p.tags || []);
      const tagsStr = '[' + orderedTags.map(t => `'${t}'`).join(', ') + ']';
      out += `  { ${mediaKey}: '${mediaVal}', label: '${p.label}', cat: '${pCat}', tags: ${tagsStr} },\n`;
    });
    out += `];\n`;
    return out;
  }

  });

  addTagBtn.addEventListener('click', () => {
    const newTag = prompt('3번째 줄(태그)에 추가할 새 태그 이름을 입력하세요 (예: 이리, 블루아카):');
    if (!newTag || !newTag.trim()) return;
    const clean = newTag.trim().replace(/^#/, '');
    if (!currentTypeList.includes(clean) && !currentThemeList.includes(clean)) {
      currentThemeList.push(clean);
      buildFilterChips();
      render();
      showToast(`'#${clean}' 태그가 추가되었습니다!`);
    } else {
      showToast('이미 있는 태그입니다.');
    }
  });

  copyPadsBtn.addEventListener('click', async () => {
    const text = generatePadsJsText();
    await navigator.clipboard.writeText(text);
    showToast('pads.js 전체 코드가 복사되었습니다! pads.js에 붙여넣으세요.');
  });

  downloadPadsBtn.addEventListener('click', () => {
    const text = generatePadsJsText();
    const blob = new Blob([text], { type: 'application/javascript;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'pads.js';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('수정된 pads.js 다운로드 완료!');
  });

  async function fire(p, el) {
    el.classList.add('fired');
    setTimeout(() => el.classList.remove('fired'), 150);

    try {
      if (p.video) {
        const a = document.createElement('a');
        a.href = p.video;
        a.download = p.video.split('/').pop();
        document.body.appendChild(a);
        a.click();
        a.remove();

        showToast(`'${p.label}' 다운로드됨`);
      } else if (p.image) {
        const response = await fetch(p.image);
        const blob = await response.blob();

        const bitmap = await createImageBitmap(blob);

        const canvas = document.createElement('canvas');
        canvas.width = bitmap.width;
        canvas.height = bitmap.height;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(bitmap, 0, 0);

        const pngBlob = await new Promise(resolve =>
          canvas.toBlob(resolve, 'image/png')
        );

        await navigator.clipboard.write([
          new ClipboardItem({
            'image/png': pngBlob
          })
        ]);

        showToast(`'${p.label}' 이미지 복사됨 → Ctrl+V`);
      } else {
        await navigator.clipboard.writeText(p.emoji);
        showToast(`'${p.label}' 복사됨`);
      }
    } catch (e) {
      console.error(e);
      showToast('실패 😭');
    }

    recent = recent.filter(r => r.label !== p.label);
    recent.unshift(p);
    recent = recent.slice(0, 6);
    renderRecent();
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');

    setTimeout(() => {
      toast.classList.remove('show');
    }, 1400);
  }

  function renderRecent() {
    if (recent.length === 0) {
      recentRow.innerHTML =
        '<span class="empty-note">아직 사용한 짤이 없어요</span>';
      return;
    }

    recentRow.innerHTML = recent.map(p => {
      const visual = p.image
        ? `<img class="recent-thumb" src="${p.image}" alt="${p.label}">`
        : p.emoji || '🎬';

      return `
        <div class="recent-item">
          ${visual} ${p.label}
        </div>
      `;
    }).join('');
  }

  catChips.forEach(chip => {
    chip.addEventListener('click', () => {
      catChips.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeCat = chip.dataset.cat;
      render();
    });
  });

  searchInput.addEventListener('input', render);

  buildFilterChips();
  render();
</script>

</body>
</html>
