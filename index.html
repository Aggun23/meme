<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>짤패드</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&display=swap');

  .category-title {
    grid-column: 1 / -1;
    font-size: 15px;
    font-weight: 700;
    color: var(--text-dim);
    margin-top: 10px;
  }

  :root {
    --bg: #14171c;
    --surface: #1d2229;
    --surface-hover: #262c35;
    --border: #2c333d;
    --text: #f2f1ed;
    --text-dim: #8b93a1;
    --img: #ff5470;
    --gif: #c6ff3d;
    --video: #3fa7ff;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 40px 24px 80px;
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    margin-bottom: 28px;
  }

  h1 {
    font-family: 'Archivo', sans-serif;
    font-weight: 800;
    font-size: 40px;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }

  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 14px;
  }

  #search {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    padding: 12px 16px;
    border-radius: 10px;
    width: 240px;
    outline: none;
  }

  #search:focus {
    border-color: var(--text-dim);
  }

  #search::placeholder {
    color: var(--text-dim);
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }

  .chip {
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .chip:hover {
    color: var(--text);
  }

  .chip.active {
    color: var(--bg);
    border-color: transparent;
  }

  .chip[data-cat="all"].active {
    background: var(--text);
  }

  .chip[data-cat="img"].active {
    background: var(--img);
  }

  .chip[data-cat="gif"].active {
    background: var(--gif);
  }

  .chip[data-cat="video"].active {
    background: var(--video);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
    margin-bottom: 40px;
  }

  .pad {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 14px 14px;
    text-align: center;
    cursor: pointer;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.35);
  }

  .pad:hover {
    background: var(--surface-hover);
  }

  .pad:active,
  .pad.fired {
    transform: translate(3px, 3px);
    box-shadow: 1px 1px 0 rgba(0,0,0,0.35);
  }

  .pad .emoji {
    font-size: 30px;
    display: block;
    margin-bottom: 10px;
  }

  .pad-img {
  width: 56px;
  height: 56px;
  object-fit: cover;
  border-radius: 8px;
  margin-bottom: 10px;
  display: block;
  margin-left: auto;
  margin-right: auto;
  }

  .pad .label {
    font-size: 13px;
    font-weight: 600;
    display: block;
    margin-bottom: 8px;
  }

  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    color: var(--bg);
  }

  .tag.img {
    background: var(--img);
  }

  .tag.gif {
    background: var(--gif);
  }

  .tag.video {
    background: var(--video);
  }

  .pad.hidden {
    display: none;
  }

  .recent-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  .recent-row {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .recent-item {
    flex: 0 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .recent-thumb {
    width: 24px;
    height: 24px;
    object-fit: cover;
    border-radius: 4px;
  }

  .empty-note {
    color: var(--text-dim);
    font-size: 13px;
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 20px);
    background: var(--text);
    color: var(--bg);
    font-weight: 600;
    font-size: 14px;
    padding: 12px 20px;
    border-radius: 10px;
    opacity: 0;
    transition: opacity .18s, transform .18s;
    pointer-events: none;
  }

  #toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
</style>
</head>

<body>
<div class="wrap">

  <header>
    <div>
      <h1>짤패드</h1>

    </div>
    <input id="search" type="text" placeholder="짤 검색... (예: 당황, 댕댕이)">

  <div class="chips" id="chips">
    <div class="chip active" data-cat="all">전체</div>
    <div class="chip" data-cat="img">이미지</div>
    <div class="chip" data-cat="gif">GIF</div>
    <div class="chip" data-cat="video">영상</div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="recent-label">최근 사용</div>
  <div class="recent-row" id="recentRow">

</div>

  const grid = document.getElementById('grid');
  const recentRow = document.getElementById('recentRow');
  const toast = document.getElementById('toast');
  const searchInput = document.getElementById('search');
  const chips = document.querySelectorAll('.chip');

  let activeCat = 'all';
  let recent = [];

  function render() {
    const q = searchInput.value.trim().toLowerCase();
    grid.innerHTML = '';

    const categories = activeCat === 'all'
      ? ['img', 'gif', 'video']
      : [activeCat];

    categories.forEach(cat => {
      const list = pads
        .filter(p =>
          p.cat === cat &&
          (!q || p.label.toLowerCase().includes(q))
        )
        .sort((a, b) => a.label.localeCompare(b.label, 'ko'));

      if (list.length === 0) return;

      if (activeCat === 'all') {
        const title = document.createElement('div');
        title.className = 'category-title';
        title.textContent = catName[cat];
        grid.appendChild(title);
      }

      list.forEach(p => {
        const el = document.createElement('div');
        el.className = 'pad';

        const visual = p.video
          ? `<video class="pad-img" src="${p.video}" muted loop playsinline></video>`
          : p.image
          ? `<img class="pad-img" src="${p.image}" alt="${p.label}">`
          : `<span class="emoji">${p.emoji}</span>`;

        el.innerHTML = `
          ${visual}
          <span class="label">${p.label}</span>
          <span class="tag ${p.cat}">${catName[p.cat]}</span>
        `;

        el.addEventListener('click', () => fire(p, el));

        if (p.video) {
          const video = el.querySelector('video');

          el.addEventListener('mouseenter', () => {
            video.currentTime = 0;
            video.play();
          });

          el.addEventListener('mouseleave', () => {
            video.pause();
            video.currentTime = 0;
          });
        }
        grid.appendChild(el);
      });
    });
  }

  async function fire(p, el) {
    el.classList.add('fired');
    setTimeout(() => el.classList.remove('fired'), 150);

    try {
      if (p.video) {
        const a = document.createElement('a');
        a.href = p.video;
        a.download = p.video.split('/').pop();
        document.body.appendChild(a);
        a.click();
        a.remove();

        showToast(`'${p.label}' 다운로드됨`);
      } else if (p.image) {
        const response = await fetch(p.image);
        const blob = await response.blob();

        await navigator.clipboard.write([
          new ClipboardItem({
            [blob.type]: blob
          })
        ]);

        showToast(`'${p.label}' 이미지 복사됨 → Ctrl+V`);
      } else {
        await navigator.clipboard.writeText(p.emoji);
        showToast(`'${p.label}' 복사됨`);
      }
    } catch (e) {
      console.error(e);
      showToast('실패 😭');
    }

    recent = recent.filter(r => r.label !== p.label);
    recent.unshift(p);
    recent = recent.slice(0, 6);
    renderRecent();
  }
  
  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');

    setTimeout(() => {
      toast.classList.remove('show');
    }, 1400);
  }

  function renderRecent() {
    if (recent.length === 0) {
      recentRow.innerHTML =
        '<span class="empty-note">아직 사용한 짤이 없어요</span>';
      return;
    }

    recentRow.innerHTML = recent.map(p => {
      const visual = p.image
        ? `<img class="recent-thumb" src="${p.image}" alt="${p.label}">`
        : p.emoji;

      return `
        <div class="recent-item">
          ${visual} ${p.label}
        </div>
      `;
    }).join('');
  }

  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      chips.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeCat = chip.dataset.cat;
      render();
    });
  });

  searchInput.addEventListener('input', render);

  render();
</script>

</body>
</html>
