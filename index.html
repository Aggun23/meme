<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>짤패드</title>
<link rel="icon" type="image/png" href="images/assets/JJAL_icon-favicon-32x32.png?v=2">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&display=swap');

  .category-title {
    grid-column: 1 / -1;
    font-size: 15px;
    font-weight: 700;
    color: var(--text-dim);
    margin-top: 10px;
  }

  :root {
    --bg: #14171c;
    --surface: #1d2229;
    --surface-hover: #262c35;
    --border: #2c333d;
    --text: #f2f1ed;
    --text-dim: #8b93a1;
    --img: #ff5470;
    --gif: #c6ff3d;
    --video: #3fa7ff;
    --tag-emo: #ffb142;
    --tag-meme: #b36bff;
    --tag-jjal: #2bcbba;
    --tag-pol: #fed330;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 40px 24px 80px;
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    margin-bottom: 24px;
  }

  h1 {
    font-family: 'Archivo', sans-serif;
    font-weight: 800;
    font-size: 40px;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }

  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 14px;
  }

  #search {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    padding: 12px 16px;
    border-radius: 10px;
    width: 260px;
    outline: none;
  }

  #search:focus {
    border-color: var(--text-dim);
  }

  #search::placeholder {
    color: var(--text-dim);
  }

  .filter-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 26px;
  }

  .chips-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .row-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dim);
    min-width: 38px;
    margin-right: 4px;
  }

  .chip {
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    user-select: none;
    transition: background .15s, color .15s, border-color .15s;
  }

  .chip:hover {
    color: var(--text);
    border-color: #3d4654;
  }

  .chip .count {
    font-size: 11px;
    font-weight: 700;
    opacity: 0.75;
  }

  .chip.active {
    color: var(--bg);
    border-color: transparent;
  }

  .chip[data-cat="all"].active,
  .chip[data-tag="all"].active {
    background: var(--text);
  }

  .chip[data-cat="img"].active {
    background: var(--img);
  }

  .chip[data-cat="gif"].active {
    background: var(--gif);
  }

  .chip[data-cat="video"].active {
    background: var(--video);
  }

  .chip[data-tag="이모티콘"].active {
    background: var(--tag-emo);
  }

  .chip[data-tag="짤"].active {
    background: var(--tag-jjal);
  }

  .chip[data-tag="MEME"].active {
    background: var(--tag-meme);
  }

  .chip[data-tag="정치인"].active {
    background: var(--tag-pol);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
    gap: 14px;
    margin-bottom: 40px;
  }

  .pad {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 12px 14px;
    text-align: center;
    cursor: pointer;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }

  .pad:hover {
    background: var(--surface-hover);
  }

  .pad:active,
  .pad.fired {
    transform: translate(3px, 3px);
    box-shadow: 1px 1px 0 rgba(0,0,0,0.35);
  }

  .pad .emoji {
    font-size: 30px;
    display: block;
    margin-bottom: 10px;
  }

  .pad-img {
    width: 56px;
    height: 56px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 10px;
    display: block;
    margin-left: auto;
    margin-right: auto;
  }

  .pad .label {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    display: block;
    width: 100%;
    margin-bottom: 8px;
    word-break: keep-all;
    overflow-wrap: break-word;
    text-wrap: balance;
  }

  .tag-group {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px;
  }

  .tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    color: var(--bg);
  }

  .tag.img {
    background: var(--img);
  }

  .tag.gif {
    background: var(--gif);
  }

  .tag.video {
    background: var(--video);
  }

  .tag.sub-tag {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-weight: 600;
  }

  .tag.sub-tag[data-t="이모티콘"] {
    border-color: rgba(255, 177, 66, 0.45);
    color: var(--tag-emo);
  }

  .tag.sub-tag[data-t="짤"] {
    border-color: rgba(43, 203, 186, 0.45);
    color: var(--tag-jjal);
  }

  .tag.sub-tag[data-t="MEME"] {
    border-color: rgba(179, 107, 255, 0.45);
    color: var(--tag-meme);
  }

  .tag.sub-tag[data-t="정치인"] {
    border-color: rgba(254, 211, 48, 0.45);
    color: var(--tag-pol);
  }

  .pad.hidden {
    display: none;
  }

  .recent-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  .recent-row {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .recent-item {
    flex: 0 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .recent-thumb {
    width: 24px;
    height: 24px;
    object-fit: cover;
    border-radius: 4px;
  }

  .empty-note {
    color: var(--text-dim);
    font-size: 13px;
    grid-column: 1 / -1;
    padding: 20px 0;
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 20px);
    background: var(--text);
    color: var(--bg);
    font-weight: 600;
    font-size: 14px;
    padding: 12px 20px;
    border-radius: 10px;
    opacity: 0;
    transition: opacity .18s, transform .18s;
    pointer-events: none;
  }

  #toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
</style>
</head>

<body>
<div class="wrap">

  <header>
    <div>
      <h1>짤패드</h1>
      <p>채팅할 때 바로 꺼내 쓰는 나만의 짤 보드</p>
    </div>
    <input id="search" type="text" placeholder="짤 또는 태그 검색... (예: 따봉, 이모티콘)">
  </header>

  <div class="filter-section">

    </div>

    <!-- 2줄: 성격/용도 태그 필터 -->
    <div class="chips-row" id="tagChips">
      <span class="row-label">분류</span>
      <div class="chip active" data-tag="all">전체 <span class="count" id="cnt-tag-all"></span></div>
      <div class="chip" data-tag="이모티콘">#이모티콘 <span class="count" id="cnt-tag-이모티콘"></span></div>
      <div class="chip" data-tag="짤">#짤 <span class="count" id="cnt-tag-짤"></span></div>
      <div class="chip" data-tag="MEME">#MEME <span class="count" id="cnt-tag-MEME"></span></div>
      <div class="chip" data-tag="정치인">#정치인 <span class="count" id="cnt-tag-정치인"></span></div>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="recent-label">최근 사용</div>
  <div class="recent-row" id="recentRow">
    <span class="empty-note">아직 사용한 짤이 없어요</span>
  </div>

</div>

<div id="toast"></div>

  }

  function updateCounts(q) {
    const cats = ['all', 'img', 'gif', 'video'];
    cats.forEach(c => {
      const count = pads.filter(p => {
        const pCat = getCat(p);
        const pTags = p.tags || [];
        const matchC = c === 'all' || pCat === c;
        const matchT = activeTag === 'all' || pTags.includes(activeTag);
        return matchC && matchT && matchesSearch(p, q);
      }).length;
      const el = document.getElementById(`cnt-cat-${c}`);
      if (el) el.textContent = count;
    });

    const tags = ['all', ...(typeof tagList !== 'undefined' ? tagList : ['이모티콘', '짤', 'MEME', '정치인'])];
    tags.forEach(t => {
      const count = pads.filter(p => {
        const pCat = getCat(p);
        const pTags = p.tags || [];
        const matchC = activeCat === 'all' || pCat === activeCat;
        const matchT = t === 'all' || pTags.includes(t);
        return matchC && matchT && matchesSearch(p, q);
      }).length;
      const el = document.getElementById(`cnt-tag-${t}`);
      if (el) el.textContent = count;
    });
  }

  function render() {
    const q = searchInput.value.trim().toLowerCase();
    grid.innerHTML = '';
    updateCounts(q);

    const categories = activeCat === 'all'
      ? ['img', 'gif', 'video']
      : [activeCat];

    let totalRendered = 0;

    categories.forEach(cat => {
      const list = pads
        .filter(p => {
          const pCat = getCat(p);
          const pTags = p.tags || [];
          const matchCat = pCat === cat;
          const matchTag = activeTag === 'all' || pTags.includes(activeTag);
          return matchCat && matchTag && matchesSearch(p, q);
        })
        .sort((a, b) => a.label.replace(/^[^가-힣a-zA-Z0-9]+/, '').localeCompare(b.label.replace(/^[^가-힣a-zA-Z0-9]+/, ''), 'ko'));

      if (list.length === 0) return;
      totalRendered += list.length;

      if (activeCat === 'all') {
        const title = document.createElement('div');
        title.className = 'category-title';
        title.textContent = `${catName[cat]} (${list.length})`;
        grid.appendChild(title);
      }

      list.forEach(p => {
        const pCat = getCat(p);
        const pTags = p.tags || [];
        const el = document.createElement('div');
        el.className = 'pad';

        const visual = p.video
          ? `<video class="pad-img" src="${p.video}" muted loop playsinline></video>`
          : p.image
          ? `<img class="pad-img" src="${p.image}" alt="${p.label}" loading="lazy">`
          : `<span class="emoji">${p.emoji}</span>`;

        const tagBadges = pTags
          .map(t => `<span class="tag sub-tag" data-t="${t}">#${t}</span>`)
          .join('');

        el.innerHTML = `
          <div>
            ${visual}
            <span class="label">${p.label}</span>
          </div>
          <div class="tag-group">
            <span class="tag ${pCat}">${catName[pCat]}</span>
            ${tagBadges}
          </div>
        `;

        el.addEventListener('click', () => fire(p, el));

        if (p.video) {
          const video = el.querySelector('video');

          el.addEventListener('mouseenter', () => {
            video.currentTime = 0;
            video.play();
          });

          el.addEventListener('mouseleave', () => {
            video.pause();
            video.currentTime = 0;
          });
        }
        grid.appendChild(el);
      });
    });

    if (totalRendered === 0) {
      grid.innerHTML = '<div class="empty-note">조건에 맞는 짤이 없어요 😢</div>';
    }
  }

  async function fire(p, el) {
    el.classList.add('fired');
    setTimeout(() => el.classList.remove('fired'), 150);

    try {
      if (p.video) {
        const a = document.createElement('a');
        a.href = p.video;
        a.download = p.video.split('/').pop();
        document.body.appendChild(a);
        a.click();
        a.remove();

        showToast(`'${p.label}' 다운로드됨`);
      } else if (p.image) {
        const response = await fetch(p.image);
        const blob = await response.blob();

        const bitmap = await createImageBitmap(blob);

        const canvas = document.createElement('canvas');
        canvas.width = bitmap.width;
        canvas.height = bitmap.height;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(bitmap, 0, 0);

        const pngBlob = await new Promise(resolve =>
          canvas.toBlob(resolve, 'image/png')
        );

        await navigator.clipboard.write([
          new ClipboardItem({
            'image/png': pngBlob
          })
        ]);

        showToast(`'${p.label}' 이미지 복사됨 → Ctrl+V`);
      } else {
        await navigator.clipboard.writeText(p.emoji);
        showToast(`'${p.label}' 복사됨`);
      }
    } catch (e) {
      console.error(e);
      showToast('실패 😭');
    }

    recent = recent.filter(r => r.label !== p.label);
    recent.unshift(p);
    recent = recent.slice(0, 6);
    renderRecent();
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');

    setTimeout(() => {
      toast.classList.remove('show');
    }, 1400);
  }

  function renderRecent() {
    if (recent.length === 0) {
      recentRow.innerHTML =
        '<span class="empty-note">아직 사용한 짤이 없어요</span>';
      return;
    }

    recentRow.innerHTML = recent.map(p => {
      const visual = p.image
        ? `<img class="recent-thumb" src="${p.image}" alt="${p.label}">`
        : p.emoji || '🎬';

      return `
        <div class="recent-item">
          ${visual} ${p.label}
        </div>
      `;
    }).join('');
  }

  catChips.forEach(chip => {
    chip.addEventListener('click', () => {
      catChips.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeCat = chip.dataset.cat;
      render();
    });
  });

  tagChips.forEach(chip => {
    chip.addEventListener('click', () => {
      tagChips.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeTag = chip.dataset.tag;
      render();
    });
  });

  searchInput.addEventListener('input', render);

  render();
</script>

</body>
</html>
